reason = "The shared DuckDB-backed adapter intentionally keeps overrideable methods on one class."

[[rule_exceptions]]
rule = "SFR601"
path = "src/sqlbuild/adapters/bigquery/classes/bigquery_adapter.py"
reason = "The BigQuery adapter intentionally keeps overrideable backend behavior on one class."

[[rule_exceptions]]
rule = "SFR601"
path = "src/sqlbuild/adapters/databricks/classes/databricks_adapter.py"
reason = "The Databricks adapter intentionally keeps overrideable backend behavior on one class."

