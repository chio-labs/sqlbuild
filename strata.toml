[[rule_exceptions]]
rule = "SFS120"
path = "src/sqlbuild/integrations/dagster/classes/sqlbuild_cli_resource.py"
symbols = ["SqlBuildCliResource.cli"]
reason = "This method follows Dagster's public cli(args, *, ...) positional convention."

[[rule_exceptions]]
rule = "SFL101"
path = "scripts/strata_policy/rules/adapter_ownership.py"
reason = "Strata 0.16.0 does not classify tooling rules/ as a role for sibling _helpers imports, despite SFR704 requiring that layout."

