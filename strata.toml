roots = ["src/sqlbuild"]
tests = ["tests"]
tooling = ["scripts"]
rule_modules = [
    "scripts.strata_policy.rules.adapter_ownership",
    "scripts.strata_policy.rules.canonical_operations",
    "scripts.strata_policy.rules.module_boundaries",
    "scripts.strata_policy.rules.orchestration_dataflow",
    "scripts.strata_policy.rules.source_hygiene",
]
select = ["SF", "XSB"]

[cache]
enabled = true
require_cacheable = true

[evaluation]
exclude = ["tests/e2e/fixtures/**"]

[thresholds]
max_positional_args = 1

[[rule_exceptions]]
rule = "SFR309"
path = "src/sqlbuild/adapter/contract/__init__.py"
reason = "The adapter contract intentionally owns overrideable behavior through its class hierarchy rather than function entrypoints."

[[rule_exceptions]]
rule = "SFR309"
path = "src/sqlbuild/adapters/bigquery/__init__.py"
reason = "The BigQuery backend intentionally owns behavior through its adapter class rather than function entrypoints."

[[rule_exceptions]]
rule = "SFR309"
path = "src/sqlbuild/adapters/databricks/constants.py"
reason = "The Databricks backend intentionally owns behavior through its adapter class rather than function entrypoints."

