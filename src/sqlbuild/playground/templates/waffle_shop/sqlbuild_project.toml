name = "waffle_shop"
adapter = "duckdb"
default_environment = "dev"

[connection]
database = "waffle_shop_control.duckdb"

[settings]
default_audit_severity = "warn"

[defaults]
materialized = "table"

[environments.prod]
schema = "prod"

[environments.dev]
schema = "dev"
defer_sources_to = "dev"

[path_defaults.staging]
materialized = "view"
