name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.52.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-tag:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release-tag
        run: |
          tag="${{ inputs.tag }}"

          case "$tag" in
            v0*) ;;
            *)
              echo "Refusing to publish tag '$tag'. PyPI publishing is limited to v0* tags."
              exit 1
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  wheels:
    name: Build wheel (${{ matrix.platform.name }})
    needs: release-tag
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: blacksmith-4vcpu-ubuntu-2404
            target: x86_64
          - name: linux-aarch64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
            target: aarch64
          - name: macos-x86_64
            runner: blacksmith-6vcpu-macos-15
            target: x86_64
          - name: macos-arm64
            runner: blacksmith-6vcpu-macos-15
            target: aarch64
          - name: windows-x86_64
            runner: blacksmith-4vcpu-windows-2025
            target: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --features extension-module
          target: ${{ matrix.platform.target }}
          manylinux: auto
      - name: Smoke test installed wheel and console entry points
        if: matrix.platform.name == 'linux-x86_64'
        run: |
          if unzip -l dist/*.whl | grep -E '(__pycache__/|\.pyc$|\.tmp$)'; then
            echo "Wheel contains generated or temporary script files"
            exit 1
          fi
          unzip -l dist/*.whl | grep 'scripts/dupscore/dupscore.toml'
          python -m venv /tmp/sqlbuild-wheel-smoke
          /tmp/sqlbuild-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/sqlbuild-wheel-smoke/bin/python -c "import sqlbuild._native as native; assert native.catalogue_json()"
          /tmp/sqlbuild-wheel-smoke/bin/sqb --help
          /tmp/sqlbuild-wheel-smoke/bin/sqlbuild --help
          mkdir -p /tmp/sqlbuild-scope-smoke/models
          printf 'name = "scope_smoke"\nadapter = "duckdb"\n' > /tmp/sqlbuild-scope-smoke/sqlbuild_project.toml
          printf 'MODEL();\nSELECT 1 AS id\n' > /tmp/sqlbuild-scope-smoke/models/orders.sql
          /tmp/sqlbuild-wheel-smoke/bin/sqb --project-dir /tmp/sqlbuild-scope-smoke scope model:orders --json
          /tmp/sqlbuild-wheel-smoke/bin/sqlbuild --project-dir /tmp/sqlbuild-scope-smoke scope model:orders
          /tmp/sqlbuild-wheel-smoke/bin/dupscore --help
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.name }}
          path: dist

  sdist:
    name: Build sdist
    needs: release-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Inspect source distribution contents
        run: |
          if tar -tzf dist/*.tar.gz | grep -E '(__pycache__/|\.pyc$|\.tmp$)'; then
            echo "Source distribution contains generated or temporary script files"
            exit 1
          fi
          tar -tzf dist/*.tar.gz | grep 'scripts/dupscore/dupscore.toml'
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  pypi:
    name: Publish to PyPI
    needs:
      - release-tag
      - wheels
      - sdist
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
