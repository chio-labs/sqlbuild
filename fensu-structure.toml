schema-version = 1

[tooling]
package = "sqlbuild-structure-checker"
runtime-forbidden-packages = [
  "sqlbuild-structure-checker",
  "fensu-structure-checker",
]

[raw-parser-boundary]
packages = []
remediation = "consume SQLBuild-owned SQL fact rows instead of raw parser types"
restricted-paths = ["crates/sqlbuild-policy-native/src/rules"]

[repository]
crate-names = [
  "sqlbuild-policy-native",
  "sqlbuild-structure-checker",
]
