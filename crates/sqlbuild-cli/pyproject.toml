[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sqlbuild-cli"
dynamic = ["version"]
description = "The native sqb and sqlbuild executables of SQLBuild"
readme = "../../README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"

[tool.maturin]
bindings = "bin"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "../../Cargo.toml" },
  { file = "../*/Cargo.toml" },
  { file = "../*/src/**/*.rs" },
]
