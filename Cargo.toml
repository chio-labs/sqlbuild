[workspace]
members = [
    "crates/sqlbuild-core",
    "crates/sqlbuild-sqltext",
    "crates/sqlbuild-analysis",
    "crates/sqlbuild-rules",
    "crates/sqlbuild-python",
]
resolver = "2"

# Native crates from the bottom up: each crate may depend only on crates listed before it.
# `make check-ci` enforces this, keeps PyO3 in the Python boundary crate and keeps polyglot
# out of every crate below the polyglot floor. See crates/README.md.
[workspace.metadata.native-layers]
order = [
    "sqlbuild-core",
    "sqlbuild-sqltext",
    "sqlbuild-analysis",
    "sqlbuild-rules",
    "sqlbuild-python",
]
python-boundary = "sqlbuild-python"
polyglot-floor = "sqlbuild-analysis"

[workspace.package]
version = "0.136.2"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.88"

[workspace.dependencies]
fensu-policy = "=0.22.0"
globset = "0.4"
# Python loads the extension with dlopen, so mimalloc must not use initial-exec TLS.
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
pyo3 = { version = "0.26", features = ["abi3-py312"] }
polyglot-sql = { git = "https://github.com/chio-labs/polyglot.git", rev = "9ff0af282829d92efeeb36b6a820be2271e1da49", default-features = false, features = [
    "ast-tools",
    "builder",
    "dialect-bigquery",
    "dialect-databricks",
    "dialect-duckdb",
    "dialect-postgresql",
    "dialect-snowflake",
    "dialect-tsql",
    "semantic",
    "stacker",
] }
polyglot-sql-function-catalogs = { git = "https://github.com/chio-labs/polyglot.git", rev = "9ff0af282829d92efeeb36b6a820be2271e1da49", default-features = false, features = [
    "dialect-duckdb",
] }
quote = "1"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
# Every crate relies on insertion-ordered JSON objects, which the extension has always built with.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sqlbuild-analysis = { path = "crates/sqlbuild-analysis" }
sqlbuild-core = { path = "crates/sqlbuild-core" }
sqlbuild-rules = { path = "crates/sqlbuild-rules" }
sqlbuild-sqltext = { path = "crates/sqlbuild-sqltext" }
stacker = "0.1"
sqlparser = { version = "0.58", features = ["visitor"] }
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
tempfile = "3"
toml = "0.9"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"

[profile.release]
strip = "symbols"
