[workspace]
members = [
    "crates/sqlbuild-rules-native",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.88"

[workspace.dependencies]
fensu-policy = "=0.22.0"
globset = "0.4"
proc-macro2 = { version = "1", features = ["span-locations"] }
pyo3 = { version = "0.26", features = ["abi3-py312"] }
polyglot-sql = { git = "https://github.com/chio-labs/polyglot.git", rev = "0cf5693958e30df58036cdfe6f9482f5c765cc7a", default-features = false, features = [
    "ast-tools",
    "builder",
    "dialect-bigquery",
    "dialect-databricks",
    "dialect-duckdb",
    "dialect-postgresql",
    "dialect-snowflake",
    "dialect-tsql",
    "semantic",
    "stacker",
] }
quote = "1"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
stacker = "0.1"
sqlparser = { version = "0.58", features = ["visitor"] }
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
tempfile = "3"
toml = "0.9"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"

[profile.release]
strip = "symbols"
