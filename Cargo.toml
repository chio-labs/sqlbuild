[workspace]
members = [
    "crates/sqlbuild-core",
    "crates/sqlbuild-cursor",
    "crates/sqlbuild-state",
    "crates/sqlbuild-pysource",
    "crates/sqlbuild-cache",
    "crates/sqlbuild-sqltext",
    "crates/sqlbuild-config",
    "crates/sqlbuild-discovery",
    "crates/sqlbuild-scopes",
    "crates/sqlbuild-model-config",
    "crates/sqlbuild-render",
    "crates/sqlbuild-attachments",
    "crates/sqlbuild-analysis",
    "crates/sqlbuild-rules",
    "crates/sqlbuild-refactor",
    "crates/sqlbuild-cli",
    "crates/sqlbuild-python",
]
resolver = "2"

# Native crates from the bottom up: each crate may depend only on crates listed before it.
# `make check-ci` enforces this, keeps PyO3 in the Python boundary crate and keeps polyglot
# out of every crate below the polyglot floor. See crates/README.md.
[workspace.metadata.native-layers]
order = [
    "sqlbuild-core",
    "sqlbuild-cursor",
    "sqlbuild-state",
    "sqlbuild-pysource",
    "sqlbuild-cache",
    "sqlbuild-sqltext",
    "sqlbuild-config",
    "sqlbuild-model-config",
    "sqlbuild-discovery",
    "sqlbuild-render",
    "sqlbuild-scopes",
    "sqlbuild-attachments",
    "sqlbuild-analysis",
    "sqlbuild-rules",
    "sqlbuild-refactor",
    "sqlbuild-cli",
    "sqlbuild-python",
]
python-boundary = "sqlbuild-python"
polyglot-floor = "sqlbuild-analysis"

[workspace.package]
version = "0.157.4"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.88"

[workspace.dependencies]
fensu-policy = "=0.22.0"
# `sqb` names compute log captures with random ids, as `uuid.uuid4().hex`.
getrandom = "0.4"
globset = "0.4"
# Windows only: tells NTFS junctions, which Python walks as directories, from symbolic links.
junction = { version = "2.1.0", default-features = false }
# Python loads the extension with dlopen, so mimalloc must not use initial-exec TLS.
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
pyo3 = { version = "0.26", features = ["abi3-py312"] }
polyglot-sql = { git = "https://github.com/chio-labs/polyglot.git", rev = "ca9e7b6e405fb6f5484472bb08780268789c5e04", default-features = false, features = [
    "ast-tools",
    "builder",
    "all-dialects",
    "semantic",
    "stacker",
] }
polyglot-sql-function-catalogs = { git = "https://github.com/chio-labs/polyglot.git", rev = "ca9e7b6e405fb6f5484472bb08780268789c5e04", default-features = false, features = [
    "dialect-duckdb",
] }
blake3 = { version = "1", features = ["rayon"] }
# Windows only: `sqb` ignores Ctrl+C while the Python CLI it started handles it.
ctrlc = "3"
quote = "1"
rayon = "1"
# Static reading of project Python source; the parser fensu uses.
ruff_python_ast = "=0.0.4"
ruff_python_parser = "=0.0.4"
ruff_text_size = "=0.0.4"
# Unix only: `sqb` shares the compute log prune lock with Python's `filelock` through `flock`.
# Fast deterministic hasher for hot in-memory maps whose iteration order never reaches output.
rustc-hash = "2"
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
saphyr-parser = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
# Every crate relies on insertion-ordered JSON objects, which the extension has always built with.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sqlbuild-analysis = { path = "crates/sqlbuild-analysis" }
sqlbuild-attachments = { path = "crates/sqlbuild-attachments" }
sqlbuild-cache = { path = "crates/sqlbuild-cache" }
sqlbuild-cli = { path = "crates/sqlbuild-cli" }
sqlbuild-config = { path = "crates/sqlbuild-config" }
sqlbuild-core = { path = "crates/sqlbuild-core" }
sqlbuild-cursor = { path = "crates/sqlbuild-cursor" }
sqlbuild-discovery = { path = "crates/sqlbuild-discovery" }
sqlbuild-render = { path = "crates/sqlbuild-render" }
sqlbuild-refactor = { path = "crates/sqlbuild-refactor" }
sqlbuild-rules = { path = "crates/sqlbuild-rules" }
sqlbuild-model-config = { path = "crates/sqlbuild-model-config" }
sqlbuild-pysource = { path = "crates/sqlbuild-pysource" }
sqlbuild-scopes = { path = "crates/sqlbuild-scopes" }
sqlbuild-sqltext = { path = "crates/sqlbuild-sqltext" }
sqlbuild-state = { path = "crates/sqlbuild-state" }
stacker = "0.1"
sqlparser = { version = "0.58", features = ["visitor"] }
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
tempfile = "3"
toml = "0.9"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
toml_parser = "1"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
strip = "symbols"

# Local iteration: release-level optimisation with incremental builds, so rebuilding after a
# focused change does not recompile the whole binding crate. CI and wheels use `release`.
[profile.fast]
inherits = "release"
incremental = true
codegen-units = 256
strip = "none"
