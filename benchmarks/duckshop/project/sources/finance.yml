# Raw finance tables, generated by the synthetic data loaders in python/loaders/finance.py.
sources:
  - name: finance__invoices
    description: Customer invoices change log
    managed: true
    contract: enforced
    columns:
      - name: invoice_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: order_id
        type: VARCHAR
      - name: invoice_number
        type: VARCHAR
      - name: issued_at
        type: TIMESTAMP_TZ
      - name: currency_code
        type: VARCHAR
      - name: totals
        type: VARIANT
      - name: tax_lines
        type: VARIANT
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
              values: ["I", "U", "D"]
      - name: _seq
        type: NUMBER(38,0)
        nullable: false
        audits:
          - not_null
          - unique
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: finance__ledger_entries
    description: General ledger postings change log
    managed: true
    contract: enforced
    columns:
      - name: entry_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: journal_code
        type: VARCHAR
      - name: account_code
        type: VARCHAR
      - name: debit_minor
        type: NUMBER(38,0)
      - name: credit_minor
        type: NUMBER(38,0)
      - name: currency_code
        type: VARCHAR
      - name: posted_at
        type: TIMESTAMP_TZ
      - name: reference
        type: VARIANT
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
              values: ["I", "U", "D"]
      - name: _seq
        type: NUMBER(38,0)
        nullable: false
        audits:
          - not_null
          - unique
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: finance__payouts
    description: Payment provider payouts change log
    managed: true
    contract: enforced
    columns:
      - name: payout_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: provider_code
        type: VARCHAR
      - name: currency_code
        type: VARCHAR
      - name: amount_minor
        type: NUMBER(38,0)
      - name: fee_minor
        type: NUMBER(38,0)
      - name: paid_out_on
        type: DATE
      - name: lines
        type: VARIANT
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
              values: ["I", "U", "D"]
      - name: _seq
        type: NUMBER(38,0)
        nullable: false
        audits:
          - not_null
          - unique
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: finance__tax_rates
    description: Sales tax rates change log
    managed: true
    contract: enforced
    columns:
      - name: tax_rate_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: country_code
        type: VARCHAR
      - name: tax_region
        type: VARCHAR
      - name: tax_category
        type: VARCHAR
      - name: rate_pct
        type: NUMBER(9,4)
      - name: valid_from
        type: DATE
      - name: valid_to
        type: DATE
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
              values: ["I", "U", "D"]
      - name: _seq
        type: NUMBER(38,0)
        nullable: false
        audits:
          - not_null
          - unique
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: finance__chargebacks
    description: Card chargebacks change log
    managed: true
    contract: enforced
    columns:
      - name: chargeback_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: payment_id
        type: VARCHAR
      - name: amount_minor
        type: NUMBER(38,0)
      - name: currency_code
        type: VARCHAR
      - name: reason_code
        type: VARCHAR
      - name: opened_at
        type: TIMESTAMP_TZ
      - name: closed_at
        type: TIMESTAMP_TZ
      - name: outcome
        type: VARCHAR
      - name: evidence
        type: VARIANT
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
              values: ["I", "U", "D"]
      - name: _seq
        type: NUMBER(38,0)
        nullable: false
        audits:
          - not_null
          - unique
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: finance__settlement_reports
    description: Append-only provider settlement files; report_body is JSON text
    managed: true
    contract: enforced
    freshness:
      strategy: sql
      type: string
      query: SELECT MAX(report_date)::VARCHAR FROM DUCKSHOP_RAW.FINANCE.SETTLEMENT_REPORTS
    columns:
      - name: report_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique_per_delivery
      - name: provider_code
        type: VARCHAR
      - name: report_date
        type: DATE
      - name: report_body
        type: VARCHAR
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
