# Raw catalogue tables, generated by the synthetic data loaders in python/loaders/catalogue.py.
sources:
  - name: catalogue__products
    description: Product master change log (rubber ducks, decoys, duck-print textiles, pond and bath goods)
    managed: true
    contract: enforced
    columns:
      - name: product_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: title
        type: VARCHAR
      - name: category_path
        type: VARCHAR
      - name: brand_code
        type: VARCHAR
      - name: launched_on
        type: DATE
      - name: is_active
        type: BOOLEAN
      - name: specs
        type: VARIANT
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
              values: ["I", "U", "D"]
      - name: _seq
        type: NUMBER(38,0)
        nullable: false
        audits:
          - not_null
          - unique
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
