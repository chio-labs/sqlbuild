# Raw storefront tables, generated by the synthetic data loaders in python/loaders/storefront.py.
sources:
  - name: storefront__customers
    description: Customer accounts change log
    managed: true
    contract: enforced
    columns:
      - name: customer_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: email
        type: VARCHAR
      - name: phone
        type: VARCHAR
      - name: full_name
        type: VARCHAR
      - name: region_code
        type: VARCHAR
      - name: storefront_code
        type: VARCHAR
      - name: created_at
        type: TIMESTAMP_TZ
      - name: updated_at
        type: TIMESTAMP_TZ
      - name: profile
        type: VARIANT
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
              values: ["I", "U", "D"]
      - name: _seq
        type: NUMBER(38,0)
        nullable: false
        audits:
          - not_null
          - unique
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
