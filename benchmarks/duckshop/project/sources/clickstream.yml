# Raw clickstream tables, generated by the synthetic data loaders in python/loaders/clickstream.py.
sources:
  - name: clickstream__web_events
    description: Append-only web clickstream; event is the raw tracker payload
    managed: true
    contract: enforced
    freshness:
      column: received_at
      lag_tolerance: 15m
      age_policy:
        warn_after: 6h
        error_after: 1d
    columns:
      - name: event_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique_per_delivery
      - name: received_at
        type: TIMESTAMP_NTZ
      - name: event
        type: VARIANT
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: clickstream__app_events
    description: Append-only mobile app events
    managed: true
    contract: enforced
    columns:
      - name: event_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique_per_delivery
      - name: received_at
        type: TIMESTAMP_NTZ
      - name: platform
        type: VARCHAR
      - name: app_version
        type: VARCHAR
      - name: payload
        type: VARIANT
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: clickstream__search_queries
    description: Append-only site search log
    managed: true
    contract: enforced
    columns:
      - name: query_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique_per_delivery
      - name: anonymous_id
        type: VARCHAR
      - name: query_text
        type: VARCHAR
      - name: results_count
        type: NUMBER(38,0)
      - name: searched_at
        type: TIMESTAMP_TZ
      - name: filters
        type: VARIANT
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: clickstream__email_events
    description: Append-only email delivery and engagement events
    managed: true
    contract: enforced
    columns:
      - name: email_event_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique_per_delivery
      - name: message_id
        type: VARCHAR
      - name: event_type
        type: VARCHAR
      - name: recipient_email
        type: VARCHAR
      - name: campaign_id
        type: VARCHAR
      - name: occurred_at
        type: TIMESTAMP_TZ
      - name: details
        type: VARIANT
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: clickstream__experiment_assignments
    description: Append-only experiment assignments
    managed: true
    contract: enforced
    columns:
      - name: assignment_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique_per_delivery
      - name: experiment_key
        type: VARCHAR
      - name: variant_key
        type: VARCHAR
      - name: anonymous_id
        type: VARCHAR
      - name: customer_id
        type: VARCHAR
      - name: assigned_at
        type: TIMESTAMP_TZ
      - name: context
        type: VARIANT
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
