# Raw support tables, generated by the synthetic data loaders in python/loaders/support.py.
sources:
  - name: support__tickets
    description: Support tickets change log; created_at is session-time-zone dependent
    managed: true
    contract: enforced
    columns:
      - name: ticket_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: customer_email
        type: VARCHAR
      - name: channel
        type: VARCHAR
      - name: priority
        type: NUMBER(38,0)
      - name: ticket_status
        type: VARCHAR
      - name: created_at
        type: TIMESTAMP_LTZ
      - name: solved_at
        type: TIMESTAMP_TZ
      - name: custom_fields
        type: VARIANT
      - name: tags
        type: ARRAY
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
              values: ["I", "U", "D"]
      - name: _seq
        type: NUMBER(38,0)
        nullable: false
        audits:
          - not_null
          - unique
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
