      - name: requested_at
        type: TIMESTAMP_TZ
      - name: received_at
        type: TIMESTAMP_TZ
      - name: photos
        type: ARRAY
      - name: refund_preference
        type: VARIANT
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
