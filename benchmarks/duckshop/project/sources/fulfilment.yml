# Raw fulfilment tables, generated by the synthetic data loaders in python/loaders/fulfilment.py.
sources:
  - name: fulfilment__shipments
    description: Shipments change log
    managed: true
    contract: enforced
    columns:
      - name: shipment_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: order_id
        type: VARCHAR
      - name: warehouse_code
        type: VARCHAR
      - name: carrier_code
        type: VARCHAR
      - name: service_level
        type: VARCHAR
      - name: shipped_at
        type: TIMESTAMP_TZ
      - name: delivered_at
        type: TIMESTAMP_TZ
      - name: tracking
        type: VARIANT
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
              values: ["I", "U", "D"]
      - name: _seq
        type: NUMBER(38,0)
        nullable: false
        audits:
          - not_null
          - unique
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: fulfilment__shipment_packages
    description: Shipment packages change log
    managed: true
    contract: enforced
    columns:
      - name: package_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: shipment_id
        type: VARCHAR
      - name: weight_grams
        type: NUMBER(38,0)
      - name: dimensions
        type: OBJECT
      - name: contents
        type: ARRAY
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
              values: ["I", "U", "D"]
      - name: _seq
        type: NUMBER(38,0)
        nullable: false
        audits:
          - not_null
          - unique
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: fulfilment__carrier_webhooks
    description: Raw carrier webhook deliveries; body is JSON text and may be malformed
    managed: true
    contract: enforced
    columns:
      - name: webhook_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique_per_delivery
      - name: carrier_code
        type: VARCHAR
      - name: received_at
        type: TIMESTAMP_NTZ
      - name: body
        type: VARCHAR
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: fulfilment__returns
    description: Customer returns change log
