# Reference data defined inline so the project compiles and replays without an FX feed.
sources:
  - name: finance__fx_rates
    description: Daily reference rates to USD per currency, defined inline as a VALUES expression
    contract: enforced
    expression: |
      SELECT v.currency_code, v.rate_date, v.rate_to_usd
      FROM (
        VALUES
          ('USD', '2025-01-01', 1.00000000),
          ('EUR', '2025-01-01', 1.03500000),
          ('GBP', '2025-01-01', 1.25100000),
          ('JPY', '2025-01-01', 0.00636000),
          ('AUD', '2025-01-01', 0.61900000),
          ('KWD', '2025-01-01', 3.24300000),
          ('USD', '2026-01-01', 1.00000000),
          ('EUR', '2026-01-01', 1.08250000),
          ('EUR', '2026-03-01', 1.09100000),
          ('EUR', '2026-03-30', 1.07800000),
          ('GBP', '2026-01-01', 1.26400000),
          ('GBP', '2026-03-01', 1.27150000),
          ('JPY', '2026-01-01', 0.00682000),
          ('JPY', '2026-03-01', 0.00671500),
          ('AUD', '2026-01-01', 0.65800000),
          ('AUD', '2026-03-01', 0.66250000),
          ('KWD', '2026-01-01', 3.25400000),
          ('KWD', '2026-03-01', 3.25150000)
      ) AS v (currency_code, rate_date, rate_to_usd)
    columns:
      - name: currency_code
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: rate_date
        type: DATE
        nullable: false
        audits:
          - not_null
      - name: rate_to_usd
        type: NUMBER(18,8)
        nullable: false
        audits:
          - not_null
