# Raw partners tables, generated by the synthetic data loaders in python/loaders/partners.py.
sources:
  - name: partners__partner_orders
    description: Append-only partner sales channel order messages in two payload versions
    managed: true
    contract: enforced
    columns:
      - name: message_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique_per_delivery
      - name: partner_code
        type: VARCHAR
      - name: schema_version
        type: NUMBER(38,0)
      - name: received_at
        type: TIMESTAMP_NTZ
      - name: payload
        type: VARIANT
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: partners__partner_listings
    description: Partner sales channel listings change log
    managed: true
    contract: enforced
    columns:
      - name: listing_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: partner_code
        type: VARCHAR
      - name: sku
        type: VARCHAR
      - name: listing_status
        type: VARCHAR
      - name: listed_at
        type: TIMESTAMP_TZ
      - name: terms
        type: VARIANT
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
              values: ["I", "U", "D"]
      - name: _seq
        type: NUMBER(38,0)
        nullable: false
        audits:
          - not_null
          - unique
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: partners__partner_settlements
    description: Partner sales channel settlement statements change log
    managed: true
    contract: enforced
    columns:
      - name: settlement_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: partner_code
        type: VARCHAR
      - name: period_start
        type: DATE
      - name: period_end
        type: DATE
      - name: currency_code
        type: VARCHAR
      - name: statement
        type: VARIANT
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
              values: ["I", "U", "D"]
      - name: _seq
        type: NUMBER(38,0)
        nullable: false
        audits:
          - not_null
          - unique
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
