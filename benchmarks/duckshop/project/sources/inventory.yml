# Raw inventory tables, generated by the synthetic data loaders in python/loaders/inventory.py.
sources:
  - name: inventory__warehouses
    description: Warehouses change log, such as The Pond and The Nest
    managed: true
    contract: enforced
    columns:
      - name: warehouse_code
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: warehouse_name
        type: VARCHAR
      - name: country_code
        type: VARCHAR
      - name: iana_timezone
        type: VARCHAR
      - name: opens_local
        type: TIME
      - name: closes_local
        type: TIME
      - name: capabilities
        type: VARIANT
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
              values: ["I", "U", "D"]
      - name: _seq
        type: NUMBER(38,0)
        nullable: false
        audits:
          - not_null
          - unique
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: inventory__stock_movements
    description: Append-only stock movement log in warehouse local time
    managed: true
    contract: enforced
    freshness:
      strategy: adapter
    columns:
      - name: movement_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique_per_delivery
      - name: sku
        type: VARCHAR
      - name: warehouse_code
        type: VARCHAR
      - name: qty_delta
        type: NUMBER(38,0)
      - name: reason_code
        type: VARCHAR
      - name: reference
        type: VARCHAR
      - name: moved_at_local
        type: TIMESTAMP_NTZ
      - name: metadata
        type: VARIANT
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: inventory__stock_counts
