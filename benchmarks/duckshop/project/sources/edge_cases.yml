# Edge-case area: raw partner payload feed with hand-picked JSON edge values, written by the fixed
# loaders in python/loaders/edge_cases.py. Not scaled by data_scale.
sources:
  - name: edge__partner_payloads
    description: >-
      Append-only partner order payloads holding JSON edge values, with the raw message text
      beside each parsed payload
    managed: true
    contract: enforced
    columns:
      - name: delivery_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: message_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: partner_code
        type: VARCHAR
      - name: received_at
        type: TIMESTAMP_NTZ
      - name: payload
        type: VARIANT
      - name: payload_text
        type: VARCHAR
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: edge__gateway_callbacks
    description: >-
      Append-only payment gateway callbacks with timestamps as merchant wall-clock times, zoned
      values, nanosecond values, free text and epoch numbers in JSON
    managed: true
    contract: enforced
    columns:
      - name: callback_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: merchant_zone
        type: VARCHAR
      - name: local_wall_time
        type: TIMESTAMP_NTZ
      - name: event_at
        type: TIMESTAMP_TZ
      - name: event_at_ns
        type: TIMESTAMP_NTZ(9)
      - name: event_time_text
        type: VARCHAR
      - name: business_date
        type: DATE
      - name: period_start
        type: TIMESTAMP_NTZ
      - name: period_end
        type: TIMESTAMP_NTZ
      - name: body
        type: VARIANT
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: edge__price_windows
    description: >-
      Price list windows per SKU whose open ends are written as sentinel dates at the edges of the
      calendar
    managed: true
    contract: enforced
    columns:
      - name: window_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: sku
        type: VARCHAR
      - name: price_minor
        type: NUMBER(38,0)
      - name: valid_from
        type: TIMESTAMP_NTZ(6)
      - name: valid_to
        type: TIMESTAMP_NTZ(6)
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
