# Edge-case area: raw partner payload feed with hand-picked JSON edge values, written by the fixed
# loaders in python/loaders/edge_cases.py. Not scaled by data_scale.
sources:
  - name: edge__partner_payloads
    description: >-
      Append-only partner order payloads holding JSON edge values, with the raw message text
      beside each parsed payload
    managed: true
    contract: enforced
    columns:
      - name: delivery_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: message_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: partner_code
        type: VARCHAR
      - name: received_at
        type: TIMESTAMP_NTZ
      - name: payload
        type: VARIANT
      - name: payload_text
        type: VARCHAR
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
