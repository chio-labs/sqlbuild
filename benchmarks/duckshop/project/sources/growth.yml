# Raw growth tables, generated by the synthetic data loaders in python/loaders/growth.py.
sources:
  - name: growth__campaign_spend
    description: Daily advertising spend exports change log
    managed: true
    contract: enforced
    columns:
      - name: spend_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: spend_date
        type: DATE
      - name: channel
        type: VARCHAR
      - name: campaign_id
        type: VARCHAR
      - name: currency_code
        type: VARCHAR
      - name: report
        type: VARIANT
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
              values: ["I", "U", "D"]
      - name: _seq
        type: NUMBER(38,0)
        nullable: false
        audits:
          - not_null
          - unique
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
