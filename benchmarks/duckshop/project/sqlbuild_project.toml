[[rules.rule_exceptions]]
rule = "SQBRSQL034"
path = "models/staging/_sqlbuild/macros/sql/load_metadata.sql"
reason = """
A column-list macro body is a select list by construction. Its columns are inserted into the
caller's own CTE, where the rule is checked again.
"""

[[rules.rule_exceptions]]
rule = "SQBRSQL034"
path = "macros/sql/money_columns.sql"
reason = """
A column-list macro body is a select list by construction. Its columns are inserted into the
caller's own CTE, where the rule is checked again.
"""

[[rules.rule_exceptions]]
rule = "SQBRSQL028"
path = "models/intermediate/catalogue/int_category_paths.sql"
reason = """
LEVEL and the CONNECT_BY_ROOT operator are hierarchical-query pseudo-columns that cannot be
qualified with a table alias.
"""

[[rules.rule_exceptions]]
rule = "SQBRTEST202"
path = "models/intermediate/catalogue/int_category_paths.sql"
reason = """
Unit-test fixture checking treats the LEVEL pseudo-column as a column the mocked categories
relation must supply, so no test of this model can compile yet. The
category_tree__rolls_sales_up_built_paths scenario builds the hierarchy from a source fixture instead.
"""

[[rules.rule_exceptions]]
rule = "SQBRTEST202"
path = "models/intermediate/clickstream/int_cart_funnel.sql"
reason = """
Unit-test fixture checking treats the FILTER, TRANSFORM and REDUCE lambda parameters (i, acc, q) as
columns the mocked relations must supply, so no test of this model can compile yet. The
cart_funnel__assigns_furthest_stage_per_session scenario covers the funnel instead.
"""

[[rules.rule_exceptions]]
rule = "SQBRSQL038"
path = "models/marts/executive/rpt_executive_kpis_daily.sql"
relation = "metric_regions"
reason = """
The KPI grid is every reporting day for every region and metric pair that has ever had a value, so
days without activity report zero instead of disappearing. Both sides are small and bounded.
"""
