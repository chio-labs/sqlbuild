[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sqlbuild"
version = "0.30.1"
description = "Typed, test-first SQL pipelines with local E2E testing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3.2",
  "polyglot-sql>=0.3.12",
  "pydantic-settings>=2,<3",
  "PyYAML>=6.0.2",
  "rich>=15.0.0",
  "sqlglot>=27.13.2",
]

[project.optional-dependencies]
performance = [
  "sqlglot[c]>=30.7.0",
]
snowflake = [
  "snowflake-connector-python>=3.17.3",
]
bigquery = [
  "google-cloud-bigquery>=3.37.0",
]
databricks = [
  "databricks-sql-connector[pyarrow]>=4.1.2",
]
dagster = [
  "dagster>=1.13.0",
  "dagster-webserver>=1.13.0",
]
postgres = [
  "psycopg[binary]>=3.2.0",
]
sqlserver = [
  "pymssql>=2.3.0",
]
ingestr = [
  "ingestr>=1.0.0",
]
rivers = [
  "rivers>=0.1.4",
]

[project.scripts]
sqb = "sqlbuild.cli.commands.main.entry:main"
sqlbuild = "sqlbuild.cli.commands.main.entry:main"
check-test-conventions = "scripts.testing.check_test_conventions:main"
check-structure-conventions = "scripts.structure.check_structure_conventions:main"
check-type-annotation-conventions = "scripts.type_annotations.check_type_annotation_conventions:main"

[dependency-groups]
dev = [
  "commitizen>=4.9.1",
  "dbt-core>=1.9.0,<1.11",
  "dbt-duckdb>=1.9.0,<1.11",
  "ingestr>=1.0.0",
  "jsonschema>=4.23.0",
  "pre-commit>=4.3.0",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.12.0",
  "testcontainers>=4.8.1",
  "ty>=0.0.1a19",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sqlbuild", "scripts"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "semver2"
update_changelog_on_bump = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "dist", "*.egg-info", ".git", ".tox"]
markers = [
  "dbt: tests that require dbt interop dependencies and dbt project setup",
  "real_warehouse: tests that require live external warehouse credentials",
  "snowflake: tests that require a live Snowflake warehouse",
  "bigquery: tests that require a live BigQuery warehouse",
  "databricks: tests that require a live Databricks warehouse",
  "postgres: tests that require a live PostgreSQL database",
  "sqlserver: tests that require a live Microsoft SQL Server database",
  "motherduck: tests that require live MotherDuck credentials",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.uv]
package = true
