[targets.python]
analyzer = "python"
roots = ["src/sqlbuild"]
tests = ["tests"]
tooling = ["scripts"]
rule_modules = [
    "scripts.fensu_policy.rules.adapter_ownership",
    "scripts.fensu_policy.rules.canonical_operations",
    "scripts.fensu_policy.rules.execution_observability",
    "scripts.fensu_policy.rules.module_boundaries",
    "scripts.fensu_policy.rules.native_boundary",
    "scripts.fensu_policy.rules.orchestration_dataflow",
    "scripts.fensu_policy.rules.source_hygiene",
]
select = ["FF", "XSB"]

[targets.python.cache]
enabled = true
require_cacheable = true

[targets.python.evaluation]
exclude = ["tests/e2e/fixtures/**"]

[targets.python.thresholds]
max_positional_args = 1

[targets.python.rule_options.XSB074]
pending_budgets = [
