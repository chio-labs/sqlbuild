[[targets.python.rule_exceptions]]
rule = "FFR309"
path = "src/sqlbuild/cost/models.py"
reason = "Native bindings own run-cost allocation, Snowflake cost collection, the statement ledger and the cost context; this package only declares the cost models and types they use."

