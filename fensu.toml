    "tests/integration/src/sqlbuild/compiler/contracts/helpers.py=1",
    "tests/integration/src/sqlbuild/compiler/model_config/helpers.py=1",
    "tests/integration/src/sqlbuild/compiler/pipeline/test_native_binding_catalog.py=1",
    "tests/integration/src/sqlbuild/compiler/project_assembly/helpers.py=1",
    "tests/unit/src/sqlbuild/cli/commands/main/compile/test_compile_command.py=2",
    "tests/unit/src/sqlbuild/cli/commands/main/dbt/test_dbt.py=4",
    "tests/unit/src/sqlbuild/cli/commands/main/init/test_run.py=2",
    "tests/unit/src/sqlbuild/integrations/dbt/test_execute.py=14",
    "tests/unit/src/sqlbuild/lint/test_cli_format.py=1",
