[targets.python]
analyzer = "python"
roots = ["src/sqlbuild"]
tests = ["tests"]
tooling = ["scripts"]
rule_modules = [
    "scripts.fensu_policy.rules.adapter_ownership",
    "scripts.fensu_policy.rules.canonical_operations",
    "scripts.fensu_policy.rules.execution_observability",
    "scripts.fensu_policy.rules.module_boundaries",
    "scripts.fensu_policy.rules.orchestration_dataflow",
    "scripts.fensu_policy.rules.source_hygiene",
]
select = ["FF", "XSB"]

[targets.python.cache]
enabled = true
require_cacheable = true

[targets.python.evaluation]
exclude = ["tests/e2e/fixtures/**"]

[targets.python.thresholds]
max_positional_args = 1

[[targets.python.rule_exceptions]]
rule = "FFR309"
path = "src/sqlbuild/adapters/bigquery/__init__.py"
reason = "The BigQuery backend intentionally owns behavior through its adapter class rather than function entrypoints."

[[targets.python.rule_exceptions]]
rule = "FFR309"
path = "src/sqlbuild/adapters/databricks/constants.py"
reason = "The Databricks backend intentionally owns behavior through its adapter class rather than function entrypoints."

[[targets.python.rule_exceptions]]
rule = "FFR309"
path = "src/sqlbuild/adapters/duckdb/__init__.py"
reason = "The DuckDB backend intentionally owns behavior through its adapter class rather than function entrypoints."

[[targets.python.rule_exceptions]]
rule = "FFR309"
path = "src/sqlbuild/adapters/motherduck/__init__.py"
reason = "The MotherDuck backend intentionally owns behavior through its adapter class rather than function entrypoints."

[[targets.python.rule_exceptions]]
rule = "FFR309"
path = "src/sqlbuild/adapters/postgres/__init__.py"
reason = "The Postgres backend intentionally owns behavior through its adapter class rather than function entrypoints."

[[targets.python.rule_exceptions]]
rule = "FFR309"
path = "src/sqlbuild/adapters/snowflake/__init__.py"
reason = "The Snowflake backend intentionally owns behavior through its adapter class rather than function entrypoints."

[[targets.python.rule_exceptions]]
rule = "FFR309"
path = "src/sqlbuild/adapters/sqlserver/__init__.py"
reason = "The SQL Server backend intentionally owns behavior through its adapter class rather than function entrypoints."

[[targets.python.rule_exceptions]]
rule = "FFR601"
path = "src/sqlbuild/adapter/contract/classes/base_adapter.py"
reason = "The adapter contract intentionally keeps its overrideable methods on one class."

[[targets.python.rule_exceptions]]
rule = "FFR601"
path = "src/sqlbuild/adapter/contract/classes/duckdb_backed_adapter.py"
reason = "The shared DuckDB-backed adapter intentionally keeps overrideable methods on one class."

[[targets.python.rule_exceptions]]
rule = "FFR601"
path = "src/sqlbuild/adapters/bigquery/classes/bigquery_adapter.py"
reason = "The BigQuery adapter intentionally keeps overrideable backend behavior on one class."

[[targets.python.rule_exceptions]]
rule = "FFR601"
path = "src/sqlbuild/adapters/databricks/classes/databricks_adapter.py"
reason = "The Databricks adapter intentionally keeps overrideable backend behavior on one class."

[[targets.python.rule_exceptions]]
rule = "FFR601"
path = "src/sqlbuild/adapters/postgres/classes/postgres_adapter.py"
reason = "The Postgres adapter intentionally keeps overrideable backend behavior on one class."

[[targets.python.rule_exceptions]]
rule = "FFR601"
path = "src/sqlbuild/adapters/snowflake/classes/snowflake_adapter.py"
reason = "The Snowflake adapter intentionally keeps overrideable backend behavior on one class."

[[targets.python.rule_exceptions]]
rule = "FFR601"
path = "src/sqlbuild/adapters/sqlserver/classes/sqlserver_adapter.py"
reason = "The SQL Server adapter intentionally keeps overrideable backend behavior on one class."

[[targets.python.rule_exceptions]]
rule = "XSB051"
path = "src/sqlbuild/compiler/planner/_helpers/warehouse/source_columns.py"
symbols = ["gather_source_inspection"]
reason = "Each type-enforced expression source is its own query whose output columns can only be read by running it; table sources are listed in one batch per database."

[[targets.python.rule_exceptions]]
rule = "XSB051"
path = "src/sqlbuild/executor/migrations/_helpers/columns.py"
symbols = ["apply_model_column_renames"]
reason = "Each in-place column rename must re-read live columns immediately before its ALTER so overlapping builds reconcile instead of failing."

[[targets.python.rule_exceptions]]
rule = "FFH005"
path = "src/sqlbuild/rule_engine/classes/module_state_monitor.py"
symbols = ["ModuleStateMonitor._snapshot"]
reason = "A failed shared snapshot only disables the shortcut; exact per-rule fingerprints then run and keep their own failure behavior, so no snapshot error may fail a Rules run."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqlbuild/integrations/dbt/_helpers/profile/render.py"
symbols = ["_render_string.env_var", "_render_string.var"]
reason = "These Jinja globals preserve dbt's external positional call protocol."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "scripts/cli_preview/_helpers/workflow.py"
symbols = ["_run_process._forward_signal"]
reason = "This callback preserves signal.signal's required positional handler protocol."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqlbuild/integrations/dlt/classes/sqlbuild_dlt_progress_collector.py"
symbols = [
    "SqlbuildDltProgressCollector.on_start_trace",
    "SqlbuildDltProgressCollector.on_start_trace_step",
    "SqlbuildDltProgressCollector.on_end_trace_step",
    "SqlbuildDltProgressCollector.on_end_trace",
    "SqlbuildDltProgressCollector.update",
]
reason = "These collector methods preserve dlt's external positional progress protocol."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqlbuild/assets.py"
symbols = ["asset"]
reason = "Bare @asset is evaluated by Python as asset(function), requiring positional function calling."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqlbuild/hooks.py"
symbols = ["hook"]
reason = "Bare @hook is evaluated by Python as hook(function), requiring positional function calling."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqlbuild/tasks.py"
symbols = ["task"]
reason = "Bare @task is evaluated by Python as task(function), requiring positional function calling."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqlbuild/python_nodes/_helpers/loader_authoring.py"
symbols = ["loader"]
reason = "Bare @loader is evaluated by Python as loader(function), requiring positional function calling."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqlbuild/runtime/event_exporting/main/lifecycle_event_sink.py"
symbols = ["lifecycle_event_sink"]
reason = "Bare lifecycle sink decorators are evaluated as decorator(function), requiring positional function calling."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqlbuild/runtime/event_exporting/main/command_output_sink.py"
symbols = ["command_output_sink"]
reason = "Bare command-output sink decorators are evaluated as decorator(function), requiring positional function calling."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqlbuild/compiler/fact_cache/_helpers/restricted_pickle.py"
symbols = ["_RestrictedUnpickler.find_class"]
reason = "This override preserves pickle.Unpickler's positional find_class(module, name) protocol."

[[targets.python.rule_exceptions]]
rule = "FFR402"
path = "src/sqlbuild/integrations/dagster/__init__.py"
reason = "These imports preserve Dagster's documented external package-root APIs."

[[targets.python.rule_exceptions]]
rule = "FFR402"
path = "src/sqlbuild/integrations/rivers/__init__.py"
reason = "These imports preserve Rivers' documented external package-root APIs."

[[targets.python.rule_exceptions]]
rule = "FFR309"
path = "src/sqlbuild/rules/__init__.py"
reason = "The Rules package is the documented custom-rule authoring API, not an internal runtime leaf."

[[targets.python.rule_exceptions]]
rule = "FFR402"
path = "src/sqlbuild/rules/__init__.py"
reason = "These imports provide the documented sqlbuild.rules package-root authoring API."

[[targets.python.rule_exceptions]]
rule = "FFR307"
path = "src/sqlbuild/rules/testing.py"
reason = "sqlbuild.rules.testing is the documented public custom-rule harness module."

[[targets.python.rule_exceptions]]
rule = "FFR403"
path = "src/sqlbuild/rules/testing.py"
reason = "This deliberate public shim keeps test-harness internals outside the stable authoring API."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqlbuild/integrations/dagster/classes/sqlbuild_cli_resource.py"
symbols = ["SqlBuildCliResource.cli"]
reason = "This method follows Dagster's public cli(args, *, ...) positional convention."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqlbuild/adapters/snowflake/classes/snowflake_connection.py"
symbols = ["_SnowflakeConnection.execute"]
reason = "This wrapper preserves the connection.execute(sql) protocol shared by adapter helpers."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqlbuild/adapters/snowflake/classes/snowflake_cursor.py"
symbols = ["_SnowflakeCursor.execute", "_SnowflakeCursor.executemany"]
reason = "This proxy preserves Snowflake's DB-API cursor positional execution protocol."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqlbuild/adapter/contract/classes/observed_cursor.py"
symbols = ["ObservedCursor.execute", "ObservedCursor.executemany"]
reason = "This proxy preserves the external DB-API cursor positional execution protocol."

[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqlbuild/adapter/contract/classes/observed_connection.py"
symbols = ["ObservedConnection.execute", "ObservedConnection.executemany"]
reason = "This proxy preserves DuckDB's positional connection execution protocol."

[[targets.python.rule_exceptions]]
rule = "FFL102"
path = "src/sqlbuild/lint/_helpers/native.py"
reason = "The lint layer reuses the compiler's MODEL() header parser; the compiler exposes no public facade for it."

[[targets.python.rule_exceptions]]
rule = "FFR601"
path = "src/sqlbuild/executor/run/_helpers/materializations/microbatch.py"
reason = "Microbatch execution is one ordered failure-sensitive lifecycle; splitting reconciliation, DML, completion publication, and aggregate gates would hide the required phase ordering across module boundaries."

[targets.rust]
analyzer = "rust"
roots = ["crates"]
tests = []
tooling = []
rule_packs = ["rust"]
select = ["FPRS"]

[[targets.rust.rule_exceptions]]
rule = "FPRSR307"
path = "crates/sqlbuild-rules/src/scope_metadata/main.rs"
reason = "This focused serde boundary validates the scope metadata schema used by the crate-root wire models."

[[targets.rust.rule_exceptions]]
rule = "FPRSR307"
path = "crates/sqlbuild-analysis/src/semantic_usage/main.rs"
reason = "This module owns the existing coarse native SQL usage-analysis boundary exposed through PyO3."

[[targets.rust.rule_exceptions]]
rule = "FPRSR307"
path = "crates/sqlbuild-analysis/src/semantic_validation/main.rs"
reason = "This module owns the existing coarse native schema-validation boundary exposed through PyO3."

[[targets.rust.rule_exceptions]]
rule = "FPRSS201"
path = "crates/sqlbuild-analysis/src/semantic_validation/models.rs"
reason = "ProjectCatalog implements Debug manually because Polyglot SchemaValidationOptions does not implement Debug; other models derive it."

[[targets.rust.rule_exceptions]]
rule = "FPRSS201"
path = "crates/sqlbuild-python/src/bindings/models.rs"
reason = "CompactAnalysisJob holds a prepared analysis closure, which cannot implement Debug; other models derive it."

[[targets.rust.rule_exceptions]]
rule = "FPRSL105"
path = "crates/sqlbuild-analysis/src/sql_tokens/main/builtin_function_names.rs"
reason = "This test-support entry exists only for the SQL lint tests in sqlbuild-rules, which the analyzer does not count as importers."

[targets.rust.rule_options.FPRSL301]
forbidden_packages = [
    "sqlbuild-structure-checker",
    "fensu-structure-checker",
]

[targets.rust.rule_options.FPRSL102]
packages = []
restricted_paths = ["crates/sqlbuild-rules/src/rules"]
remediation = "consume SQLBuild-owned SQL fact rows instead of raw parser types"

[targets.rust.rule_options.FPRSL304]
crate_names = [
    "sqlbuild-analysis",
    "sqlbuild-core",
    "sqlbuild-python",
    "sqlbuild-rules",
    "sqlbuild-sqltext",
]

[[dupes.contract_exemptions]]
contract = "src/sqlbuild/adapter/contract/classes/strict_adapter.py:StrictAdapter"
forbidden_owners = ["src/sqlbuild/adapter/contract/classes/base_adapter.py:BaseAdapter"]
paths = ["src/sqlbuild/adapter/contract/classes/*", "src/sqlbuild/adapters/*/classes/*"]
reason = "tests/unit/src/sqlbuild/adapter/contract/classes/strict_adapter/test_strict_adapter.py requires every first-class adapter to define each StrictAdapter method itself instead of inheriting it from BaseAdapter."

[[targets.python.rule_exceptions]]
rule = "XSB051"
path = "src/sqlbuild/executor/migrations/_helpers/old_name_views.py"
symbols = [
  "present_old_name_views",
  "recreate_old_name_views",
  "refresh_old_name_views",
  "run_planned_old_name_steps",
]
reason = "Old-name steps re-read facts and physical state per move so a retry never repeats a completed step, and compatibility views are re-created in dependency order, so a chained view must read the columns of the view it selects from after that view is re-created. Each view's existence is checked right before it is redefined, and a model has only its own short chain of old names."

[[targets.python.rule_exceptions]]
rule = "XSB051"
path = "src/sqlbuild/executor/old_name_views/_helpers/janitor.py"
symbols = ["plan_old_name_views", "apply_old_name_view_drops"]
reason = "Janitor reads each compatibility view's stored definition right before deciding to drop it, so a relation that replaced the view is never dropped; a project has few live old names."
