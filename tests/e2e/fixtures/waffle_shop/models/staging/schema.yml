models:
  - name: stg_customers
    description: Cleaned customer records.
    columns:
      - name: customer_id
        audits:
          - not_null
          - unique
      - name: email
        audits:
          - not_null

  - name: stg_orders
    description: Cleaned order records.
    columns:
      - name: order_id
        audits:
          - not_null
          - unique
      - name: customer_id
        audits:
          - not_null
      - name: status
        audits:
          - accepted_values:
              values: ["placed", "preparing", "ready", "completed", "cancelled"]

  - name: stg_payments
    description: Cleaned payment records.
    columns:
      - name: payment_id
        audits:
          - not_null
          - unique
      - name: order_id
        audits:
          - not_null
